<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Idea Market — Where Ideas Become Ventures</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0e18; --bg-raised:#12152400; --panel:#151829; --panel-2:#10121f;
  --line:#262a42; --line-soft:#1b1e33;
  --text:#eef0f8; --text-dim:#a2a7c4; --text-faint:#5f6486;
  --gold:#d8b46a; --gold-dim:#8a7040;
  --violet:#8b7fd6; --violet-dim:#5b5296;
  --teal:#3ecb96; --rose:#e6707a;
  --f-display:'Fraunces', serif; --f-body:'Inter', sans-serif; --f-mono:'JetBrains Mono', monospace;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  background:
    radial-gradient(1100px 550px at 90% -8%, rgba(139,127,214,0.10), transparent 60%),
    radial-gradient(900px 500px at 5% 105%, rgba(216,180,106,0.07), transparent 60%),
    var(--bg);
  color:var(--text); font-family:var(--f-body); min-height:100vh; line-height:1.55;
}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important;} }
a{color:inherit; text-decoration:none;} button{font-family:inherit;} ::selection{background:var(--gold); color:#1a1406;}
::-webkit-scrollbar{width:8px; height:8px;} ::-webkit-scrollbar-thumb{background:var(--line); border-radius:8px;}

.shell{max-width:1360px; margin:0 auto; padding:0 26px 90px;}
.hide{display:none !important;}

/* ---------- Top nav ---------- */
header.nav{
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  padding:20px 4px; border-bottom:1px solid var(--line-soft); margin-bottom:26px; flex-wrap:wrap;
}
.logo{display:flex; align-items:center; gap:11px;}
.logo .mark{
  width:38px; height:38px; border-radius:10px;
  background:linear-gradient(155deg, var(--gold), var(--gold-dim));
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
  box-shadow:0 6px 18px -6px rgba(216,180,106,.45);
}
.logo .mark svg{width:20px; height:20px; color:#1a1406;}
.logo .word{font-family:var(--f-display); font-size:21px; font-weight:600; letter-spacing:-0.01em;}
.logo .word em{font-style:normal; color:var(--gold);}
nav.tabs{display:flex; gap:6px; flex-wrap:wrap;}
.navbtn{
  background:transparent; border:1px solid transparent; color:var(--text-dim);
  padding:9px 15px; border-radius:9px; cursor:pointer; font-size:13.5px; font-weight:500;
  transition:all .15s ease;
}
.navbtn:hover{color:var(--text); background:var(--panel);}
.navbtn.active{color:var(--text); background:var(--panel); border-color:var(--line);}
.acct{display:flex; align-items:center; gap:10px;}
.acct-pill{
  display:flex; align-items:center; gap:8px; background:var(--panel); border:1px solid var(--line);
  border-radius:20px; padding:6px 8px 6px 14px; font-size:12.5px; color:var(--text-dim); cursor:pointer;
  position:relative;
}
.acct-pill .av{width:22px; height:22px; border-radius:50%; background:linear-gradient(155deg,var(--violet),var(--violet-dim)); display:flex; align-items:center; justify-content:center; font-family:var(--f-mono); font-size:10px; color:#fff; font-weight:700;}
.acct-menu{
  position:absolute; top:calc(100% + 8px); right:0; background:var(--panel); border:1px solid var(--line);
  border-radius:12px; padding:10px; min-width:220px; z-index:50; box-shadow:0 20px 40px -12px rgba(0,0,0,.5);
}
.acct-menu input{width:100%; margin-bottom:8px;}
.acct-menu .userlist{max-height:140px; overflow-y:auto; margin-bottom:8px;}
.acct-menu .uitem{padding:8px 10px; border-radius:7px; cursor:pointer; font-size:12.5px; color:var(--text-dim); display:flex; justify-content:space-between;}
.acct-menu .uitem:hover{background:var(--panel-2); color:var(--text);}
.acct-menu .uitem.current{color:var(--gold);}

/* ---------- Buttons / inputs ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  border-radius:9px; padding:11px 18px; font-weight:600; font-size:13.5px; cursor:pointer; border:1px solid transparent;
  transition:filter .15s ease, transform .1s ease, background .15s ease;
}
.btn:active{transform:scale(.98);}
.btn-gold{background:linear-gradient(155deg, var(--gold), var(--gold-dim)); color:#1a1406;}
.btn-gold:hover{filter:brightness(1.08);}
.btn-ghost{background:var(--panel); color:var(--text); border-color:var(--line);}
.btn-ghost:hover{border-color:var(--gold-dim);}
.btn-violet{background:linear-gradient(155deg, var(--violet), var(--violet-dim)); color:#fff;}
.btn-violet:hover{filter:brightness(1.1);}
.btn-teal{background:rgba(62,203,150,0.14); color:var(--teal); border-color:rgba(62,203,150,0.35);}
.btn-teal:hover{background:rgba(62,203,150,0.22);}
.btn-danger{background:rgba(230,112,122,0.14); color:var(--rose); border-color:rgba(230,112,122,0.35);}
.btn-sm{padding:7px 13px; font-size:12px; border-radius:7px;}
.btn:disabled{opacity:.45; cursor:not-allowed;}

label.flabel{font-size:11.5px; font-family:var(--f-mono); text-transform:uppercase; letter-spacing:.07em; color:var(--text-faint); display:block; margin-bottom:7px;}
input[type=text], input[type=number], textarea, select{
  width:100%; background:var(--panel-2); border:1px solid var(--line); color:var(--text);
  border-radius:9px; padding:11px 13px; font-family:var(--f-body); font-size:13.5px; outline:none;
  transition:border-color .15s ease;
}
input:focus, textarea:focus, select:focus{border-color:var(--gold-dim);}
textarea{resize:vertical; min-height:80px;}
.field{margin-bottom:16px;}
.field-row{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
@media(max-width:640px){.field-row{grid-template-columns:1fr;}}
.check-row{display:flex; align-items:center; gap:9px; font-size:13px; color:var(--text-dim); margin-bottom:8px; cursor:pointer;}
.check-row input{width:16px; height:16px; accent-color:var(--gold);}

.panel{background:linear-gradient(180deg, var(--panel), var(--panel-2)); border:1px solid var(--line); border-radius:16px; padding:22px;}
.section-title{font-family:var(--f-display); font-size:19px; font-weight:600; margin-bottom:4px;}
.section-sub{font-size:12.5px; color:var(--text-faint); margin-bottom:18px;}

/* ---------- Seal (signature element) ---------- */
.seal{
  width:52px; height:52px; border-radius:50%; flex-shrink:0; position:relative;
  background:conic-gradient(var(--gold) calc(var(--pct)*1%), rgba(216,180,106,0.12) 0);
  display:flex; align-items:center; justify-content:center;
}
.seal::after{
  content:''; position:absolute; inset:5px; border-radius:50%; background:var(--panel-2);
  border:1px solid var(--line);
}
.seal .num{position:relative; z-index:2; font-family:var(--f-mono); font-weight:700; font-size:15px; color:var(--gold);}
.seal.small{width:38px; height:38px;} .seal.small .num{font-size:11.5px;}
.seal.big{width:96px; height:96px;} .seal.big .num{font-size:26px;}

/* ---------- Empty states ---------- */
.empty{
  text-align:center; padding:60px 20px; color:var(--text-faint);
}
.empty svg{width:34px; height:34px; margin-bottom:14px; opacity:.5;}
.empty h3{font-family:var(--f-display); font-size:17px; color:var(--text-dim); margin-bottom:6px; font-weight:600;}
.empty p{font-size:13px; max-width:360px; margin:0 auto 16px;}

/* ---------- Market view ---------- */
#view-market{display:grid; grid-template-columns:250px 1fr; gap:22px; align-items:start;}
@media(max-width:900px){#view-market{grid-template-columns:1fr;}}
.filters{position:sticky; top:20px;}
.filters .fgroup{margin-bottom:18px;}
.filters h4{font-family:var(--f-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-faint); margin-bottom:9px;}
.sort-tabs{display:flex; flex-direction:column; gap:5px;}
.sort-tab{
  background:transparent; border:1px solid transparent; text-align:left; padding:8px 10px; border-radius:8px;
  color:var(--text-dim); font-size:13px; cursor:pointer;
}
.sort-tab:hover{background:var(--panel-2);}
.sort-tab.active{background:var(--panel); border-color:var(--line); color:var(--gold); font-weight:600;}

.market-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; gap:10px; flex-wrap:wrap;}
.market-head .count{font-size:12.5px; color:var(--text-faint); font-family:var(--f-mono);}
.cards-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:16px;}

.idea-card{
  background:linear-gradient(180deg, var(--panel), var(--panel-2)); border:1px solid var(--line);
  border-radius:15px; padding:18px; cursor:pointer; transition:border-color .15s ease, transform .12s ease;
  display:flex; flex-direction:column; gap:12px;
}
.idea-card:hover{border-color:var(--gold-dim); transform:translateY(-2px);}
.idea-card .top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
.idea-card .cat-tag{
  font-family:var(--f-mono); font-size:10px; text-transform:uppercase; letter-spacing:.06em;
  color:var(--violet); background:rgba(139,127,214,0.12); padding:4px 9px; border-radius:20px; display:inline-block;
}
.idea-card h3{font-family:var(--f-display); font-size:17px; font-weight:600; margin:8px 0 4px;}
.idea-card .problem{font-size:12.5px; color:var(--text-dim); line-height:1.5; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
.idea-card .meta-row{display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--text-faint); margin-top:auto;}
.idea-card .price-tag{font-family:var(--f-mono); color:var(--gold); font-weight:600;}
.idea-card .stat-icons{display:flex; gap:12px; align-items:center;}
.idea-card .stat-icons span{display:flex; align-items:center; gap:4px;}
.idea-card .stat-icons svg{width:13px; height:13px;}
.idea-card .heart{background:none; border:none; cursor:pointer; color:var(--text-faint); flex-shrink:0;}
.idea-card .heart svg{width:18px; height:18px;}
.idea-card .heart.on{color:var(--rose);}
.idea-card .funding-mini{height:5px; background:var(--panel-2); border-radius:6px; overflow:hidden; border:1px solid var(--line);}
.idea-card .funding-mini .f{height:100%; background:linear-gradient(90deg, var(--teal), #2a9d70);}

/* ---------- Detail view ---------- */
.detail-head{display:flex; gap:22px; align-items:flex-start; flex-wrap:wrap; margin-bottom:22px;}
.detail-head .seal.big{margin-top:4px;}
.detail-titles{flex:1; min-width:240px;}
.detail-titles .cat-tag{margin-bottom:10px; display:inline-block;}
.detail-titles h1{font-family:var(--f-display); font-size:30px; font-weight:600; letter-spacing:-0.01em; margin-bottom:8px;}
.detail-titles .byline{font-size:12.5px; color:var(--text-faint); font-family:var(--f-mono);}
.score-breakdown{display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin:18px 0;}
@media(max-width:760px){.score-breakdown{grid-template-columns:repeat(2,1fr);}}
.sb-item .lbl{font-size:10.5px; color:var(--text-faint); font-family:var(--f-mono); text-transform:uppercase; letter-spacing:.05em; margin-bottom:6px;}
.sb-bar{height:5px; border-radius:5px; background:var(--panel-2); border:1px solid var(--line); overflow:hidden; margin-bottom:5px;}
.sb-bar .f{height:100%; background:linear-gradient(90deg, var(--violet), var(--gold));}
.sb-item .val{font-family:var(--f-mono); font-size:12px; color:var(--text-dim);}

.detail-grid{display:grid; grid-template-columns:1.6fr 1fr; gap:20px; align-items:start;}
@media(max-width:900px){.detail-grid{grid-template-columns:1fr;}}
.dblock{margin-bottom:20px;}
.dblock h4{font-family:var(--f-display); font-size:15px; font-weight:600; margin-bottom:8px;}
.dblock p{font-size:13.5px; color:var(--text-dim); line-height:1.65;}
.tag-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:6px;}
.pill{font-family:var(--f-mono); font-size:11px; background:var(--panel-2); border:1px solid var(--line); padding:5px 11px; border-radius:20px; color:var(--text-dim);}

.action-panel{display:flex; flex-direction:column; gap:10px;}
.mini-panel{background:var(--panel-2); border:1px solid var(--line); border-radius:13px; padding:16px;}
.mini-panel h5{font-family:var(--f-mono); font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint); margin-bottom:12px;}
.fund-bar{height:9px; border-radius:6px; background:var(--panel); border:1px solid var(--line); overflow:hidden; margin:8px 0;}
.fund-bar .f{height:100%; background:linear-gradient(90deg, var(--teal), #2a9d70); transition:width .4s ease;}
.fund-nums{display:flex; justify-content:space-between; font-family:var(--f-mono); font-size:12.5px;}
.sponsor-list, .team-list, .req-list{margin-top:10px; display:flex; flex-direction:column; gap:6px;}
.sponsor-row, .team-row, .req-row{display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--text-dim); background:var(--panel); padding:7px 10px; border-radius:8px; border:1px solid var(--line-soft);}
.req-row .req-actions{display:flex; gap:6px;}

.stars{display:flex; gap:3px; cursor:pointer;}
.stars svg{width:18px; height:18px; color:var(--line);}
.stars svg.on{color:var(--gold);}
.review{padding:12px 0; border-bottom:1px solid var(--line-soft);}
.review .rh{display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;}
.review .rh .who{font-weight:600; font-size:13px;}
.review .rh .stars svg{width:13px; height:13px;}
.review p{font-size:12.5px; color:var(--text-dim);}

.toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
  background:var(--panel); border:1px solid var(--gold-dim); color:var(--text); padding:12px 20px;
  border-radius:10px; font-size:13px; z-index:100; box-shadow:0 20px 40px -12px rgba(0,0,0,.6);
  opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

/* ---------- Dashboard ---------- */
.dash-stats{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:22px;}
@media(max-width:760px){.dash-stats{grid-template-columns:1fr 1fr;}}
.dstat{background:var(--panel); border:1px solid var(--line); border-radius:13px; padding:16px;}
.dstat .l{font-family:var(--f-mono); font-size:10.5px; text-transform:uppercase; color:var(--text-faint); margin-bottom:8px;}
.dstat .v{font-family:var(--f-display); font-size:24px; font-weight:600;}
.dash-idea-row{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:13px 14px; border:1px solid var(--line); border-radius:11px; margin-bottom:10px; cursor:pointer; background:var(--panel-2);}
.dash-idea-row:hover{border-color:var(--gold-dim);}
.dash-idea-row .name{font-weight:600; font-size:13.5px;}
.dash-idea-row .stats{display:flex; gap:14px; font-size:11.5px; color:var(--text-faint); font-family:var(--f-mono);}
.badge-count{background:var(--rose); color:#fff; font-size:10px; font-family:var(--f-mono); border-radius:20px; padding:2px 7px; margin-left:6px;}

footer{text-align:center; margin-top:40px; padding-top:20px; border-top:1px solid var(--line-soft); font-family:var(--f-mono); font-size:11px; color:var(--text-faint);}
</style>
</head>
<body>

<div class="shell">
  <header class="nav">
    <div class="logo">
      <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a6 6 0 0 0-4 10.5c.7.7 1 1.3 1 2.5h6c0-1.2.3-1.8 1-2.5A6 6 0 0 0 12 2Z"/></svg></div>
      <div class="word">Idea <em>Market</em></div>
    </div>
    <nav class="tabs" id="navTabs">
      <button class="navbtn" data-view="market">Marketplace</button>
      <button class="navbtn" data-view="post">Post an Idea</button>
      <button class="navbtn" data-view="dashboard">My Dashboard</button>
    </nav>
    <div class="acct" id="acctArea"></div>
  </header>

  <main id="app"></main>

  <footer>Idea Market Prototype — every idea, score, vote, review, pledge and team shown here comes only from data entered on this device.</footer>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){

  // ============ DATA LAYER ============
  const DB_KEY = 'ideaMarketDB_v1';
  const CATEGORIES = ['Technology','Environment & Sustainability','Health & Wellness','Education','Social Impact','Hardware / IoT','Business & Finance','Agriculture','Art & Design','Other'];
  const COLLAB_ROLES = ['Programmer / Developer','Designer','Hardware Developer','AI / ML Developer','Business / Marketing','Researcher','Other'];
  const SPONSOR_TYPES = ['Financial funding','Hardware / components','Software / cloud resources','Mentorship','Workspace / lab support','Promotion'];

  function loadDB(){
    try{
      const raw = localStorage.getItem(DB_KEY);
      if (raw) return JSON.parse(raw);
    }catch(e){}
    return { users:[], currentUser:null, ideas:[], wishlist:{} };
  }
  function saveDB(){ localStorage.setItem(DB_KEY, JSON.stringify(db)); }
  let db = loadDB();

  let ui = { view:'market', detailId:null, filters:{ search:'', category:'', sort:'new', sponsorOnly:false }, acctMenuOpen:false };

  // ============ HELPERS ============
  function uid(){ return 'id-' + Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
  function initials(name){ return (name||'?').trim().slice(0,2).toUpperCase(); }
  function esc(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function toast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('show'), 2600);
  }
  function currentUser(){ return db.currentUser; }
  function requireLogin(){
    if (!db.currentUser){ toast('Create or select an account first — use the account menu, top right.'); return false; }
    return true;
  }

  // ============ AI IDEA SCORE (deterministic scoring model) ============
  function computeScore(idea){
    const text = ((idea.description||'')+' '+(idea.problem||'')+' '+(idea.solution||'')).toLowerCase();
    const words = text.split(/\s+/).filter(Boolean);
    const uniq = new Set(words);
    const richness = Math.min(1, uniq.size/55);
    const depth = Math.min(1, words.length/170);
    const innovation = Math.round(50 + richness*32 + depth*13);

    const resWords = (idea.resourcesNeeded||'').split(/\s+/).filter(Boolean).length;
    const feasibility = Math.round(52 + Math.min(38, resWords*2.6));

    const socialKeywords = ['sustainab','environment','recycle','waste','health','education','accessib','poverty','clean','renewable','communit','safety','disab','women','farmer','rural','elderly','child','water','literacy'];
    let hits = 0; socialKeywords.forEach(k=>{ if(text.includes(k)) hits++; });
    const socialImpact = Math.round(42 + Math.min(48, hits*8.5));

    const catWeight = {'Technology':80,'Environment & Sustainability':79,'Health & Wellness':83,'Education':76,'Social Impact':77,'Hardware / IoT':78,'Business & Finance':81,'Agriculture':74,'Art & Design':68,'Other':64};
    const price = idea.price || 0;
    const marketPotential = Math.round((catWeight[idea.category]||70) - Math.min(14, price>0 ? Math.log10(price+1)*2.2 : 0));

    const fundingReq = idea.fundingRequired || 0;
    const scalability = Math.round(88 - Math.min(34, Math.log10(fundingReq+1)*7.5));

    const total = Math.round((innovation+feasibility+marketPotential+socialImpact+scalability)/5);
    return {
      total: Math.max(38, Math.min(98, total)),
      innovation: Math.max(35,Math.min(98,innovation)),
      feasibility: Math.max(35,Math.min(98,feasibility)),
      marketPotential: Math.max(35,Math.min(98,marketPotential)),
      socialImpact: Math.max(35,Math.min(98,socialImpact)),
      scalability: Math.max(35,Math.min(98,scalability))
    };
  }

  function avgRating(idea){
    if (!idea.ratings.length) return 0;
    return idea.ratings.reduce((s,r)=>s+r.stars,0) / idea.ratings.length;
  }
  function fundingRaised(idea){
    return idea.sponsors.filter(s=>s.type==='Financial funding').reduce((s,x)=>s+x.amount,0);
  }

  // ============ SEAL SVG ============
  function seal(score, size){
    const cls = size==='big' ? 'seal big' : (size==='small' ? 'seal small' : 'seal');
    return `<div class="${cls}" style="--pct:${score}"><span class="num">${score}</span></div>`;
  }
  function starsSvg(n, filled, size){
    let out = '';
    for(let i=1;i<=5;i++){
      out += `<svg viewBox="0 0 24 24" fill="${i<=filled?'currentColor':'none'}" stroke="currentColor" stroke-width="1.6" class="${i<=filled?'on':''}"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`;
    }
    return out;
  }

  // ============ ACCOUNT UI ============
  function renderAcct(){
    const area = document.getElementById('acctArea');
    if (!db.currentUser){
      area.innerHTML = `
        <div class="acct-pill" id="acctPillBtn"><span>Sign in / Create account</span></div>
        ${ui.acctMenuOpen ? acctMenuHtml() : ''}
      `;
    } else {
      area.innerHTML = `
        <div class="acct-pill" id="acctPillBtn"><div class="av">${initials(db.currentUser)}</div><span>${esc(db.currentUser)}</span></div>
        ${ui.acctMenuOpen ? acctMenuHtml() : ''}
      `;
    }
    document.getElementById('acctPillBtn').onclick = (e)=>{ e.stopPropagation(); ui.acctMenuOpen = !ui.acctMenuOpen; renderAcct(); };
    if (ui.acctMenuOpen){
      const input = document.getElementById('newUserInput');
      document.getElementById('createUserBtn').onclick = ()=>{
        const name = input.value.trim();
        if (!name) return;
        if (!db.users.includes(name)) db.users.push(name);
        db.currentUser = name; ui.acctMenuOpen = false; saveDB(); render();
      };
      document.querySelectorAll('.uitem').forEach(el=>{
        el.onclick = ()=>{ db.currentUser = el.dataset.u; ui.acctMenuOpen=false; saveDB(); render(); };
      });
    }
  }
  function acctMenuHtml(){
    return `<div class="acct-menu" onclick="event.stopPropagation()">
      ${db.users.length ? `<div class="userlist">${db.users.map(u=>`<div class="uitem ${u===db.currentUser?'current':''}" data-u="${esc(u)}">${esc(u)} ${u===db.currentUser?'· active':''}</div>`).join('')}</div>` : `<div style="font-size:12px;color:var(--text-faint);margin-bottom:8px;">No accounts yet on this device.</div>`}
      <input type="text" id="newUserInput" placeholder="Enter a name to sign in as">
      <button class="btn btn-gold btn-sm" id="createUserBtn" style="width:100%;">Create / Switch</button>
    </div>`;
  }
  document.addEventListener('click', ()=>{ if(ui.acctMenuOpen){ ui.acctMenuOpen=false; renderAcct(); } });

  // ============ NAV ============
  function renderNav(){
    document.querySelectorAll('.navbtn').forEach(b=>{
      b.classList.toggle('active', b.dataset.view === ui.view);
      b.onclick = ()=>{ ui.view = b.dataset.view; ui.detailId=null; render(); };
    });
  }

  // ============ MARKET VIEW ============
  function filteredIdeas(){
    let list = db.ideas.slice();
    const f = ui.filters;
    if (f.search) {
      const s = f.search.toLowerCase();
      list = list.filter(i => i.name.toLowerCase().includes(s) || i.problem.toLowerCase().includes(s) || i.category.toLowerCase().includes(s));
    }
    if (f.category) list = list.filter(i => i.category === f.category);
    if (f.sponsorOnly) list = list.filter(i => i.fundingRequired > 0);
    if (f.sort === 'new') list.sort((a,b)=> b.createdAt - a.createdAt);
    if (f.sort === 'trending') list.sort((a,b)=> b.votes.length - a.votes.length);
    if (f.sort === 'top') list.sort((a,b)=> (computeScore(b).total) - (computeScore(a).total));
    if (f.sort === 'funding') list.sort((a,b)=> (b.fundingRequired - fundingRaised(b)) - (a.fundingRequired - fundingRaised(a)));
    return list;
  }

  function renderMarket(){
    const list = filteredIdeas();
    return `
      <div id="view-market">
        <div class="panel filters">
          <div class="fgroup">
            <h4>Search</h4>
            <input type="text" id="searchInput" placeholder="Search ideas..." value="${esc(ui.filters.search)}">
          </div>
          <div class="fgroup">
            <h4>Category</h4>
            <select id="categoryFilter">
              <option value="">All categories</option>
              ${CATEGORIES.map(c=>`<option value="${c}" ${ui.filters.category===c?'selected':''}>${c}</option>`).join('')}

          </div>
          <div class="fgroup">
            <h4>Sort</h4>
            <div class="sort-tabs">
              <button class="sort-tab ${ui.filters.sort==='new'?'active':''}" data-sort="new">🆕 New</button>
              <button class="sort-tab ${ui.filters.sort==='trending'?'active':''}" data-sort="trending">🔥 Trending</button>
              <button class="sort-tab ${ui.filters.sort==='top'?'active':''}" data-sort="top">🏆 Top Idea Score</button>

    return `<div class="empty panel">

  function ideaCard(idea){

    const raised = fundingRaised(idea);
    const wished = (db.wishlist[db.currentUser]||[]).includes(idea.id);
    const fundPct = idea.fundingRequired>0 ? Math.min(100, (raised/idea.fundingRequired)*100) : 0;
    return `
      <div class="idea-card" data-id="${idea.id}">
        <div class="top">
          ${seal(score,'small')}
          <button class="heart ${wished?'on':''}" data-wish="${idea.id}" title="Save to wishlist">
            <svg viewBox="0 0 24 24" fill="${wished?'currentColor':'none'}" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"/></svg>
          </button>
        </div>
        <span class="cat-tag">${esc(idea.category)}</span>
        <h3>${esc(idea.name)}</h3>
        <p class="problem">${esc(idea.problem)}</p>
        ${idea.fundingRequired>0 ? `<div class="funding-mini"><div class="f" style="width:${fundPct}%"></div></div>` : ''}
        <div class="meta-row">
          <span class="price-tag">${idea.offerTypes.includes('License') && !idea.offerTypes.includes('Buy') ? 'License' : (idea.price>0 ? '₹'+idea.price.toLocaleString('en-IN') : 'Open to offers')}</span>
          <span class="stat-icons">
            <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>${idea.views}</span>
            <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 10v12M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"/></svg>${idea.votes.length}</span>
          </span>
        </div>
      </div>
    `;
  }

    return `
      <div>
        <button class="btn btn-ghost btn-sm" id="backBtn" style="margin-bottom:18px;">&larr; Back to marketplace</button>

              <div class="dblock"><h4>Proposed Solution</h4><p>${esc(idea.solution)}</p></div>
              <div class="dblock"><h4>Full Description</h4><p>${esc(idea.description)}</p></div>

                    ${idea.offerTypes.includes('License') ? `<button class="btn btn-violet btn-sm" id="licenseBtn" ${idea.licensedBy?'disabled':''}>${idea.licensedBy? 'Already licensed' : 'Request License'}</button>` : ''}

                      <div class="req-row">
                        <span>${esc(r.user)} · ${esc(r.role)} <em style="color:var(--text-faint)">(${r.status})</em></span>

              ${idea.offerTypes.includes('Sponsorship') ? `

                  <div class="fund-bar"><div class="f" style="width:${idea.fundingRequired>0?Math.min(100,(raised/idea.fundingRequired)*100):0}%"></div></div>

                  ${idea.sponsors.length ? `<div class="sponsor-list">${idea.sponsors.map(s=>`<div class="sponsor-row"><span>${esc(s.user)} · ${esc(s.type)}</span><span>${s.type==='Financial funding' ? '₹'+s.amount.toLocaleString('en-IN') : ''}</span></div>`).join('')}</div>` : ''}
                  ${(!isOwner && db.currentUser) ? sponsorForm() : (!db.currentUser ? `<p style="font-size:12px;color:var(--text-faint);margin-top:8px;">Sign in to sponsor this project.</p>` : '')}
                </div>` : ''}
            </div>
          </div>
        </div>
      </div>
    `;
  }
  function sbItem(label, val){
    return `<div class="sb-item"><div class="lbl">${label}</div><div class="sb-bar"><div class="f" style="width:${val}%"></div></div><div class="val">${val}/100</div></div>`;

  function reviewForm(){
    return `<div style="margin-top:14px;">

      <textarea id="reviewComment" placeholder="Share your thoughts on this idea..." style="margin-top:8px;"></textarea>

  function collabForm(){
    return `<div class="field" style="margin-bottom:8px;">

    </div>
    <textarea id="collabMsg" placeholder="Briefly say why you'd be a good fit..." style="margin-bottom:8px;"></textarea>
    <button class="btn btn-violet btn-sm" id="collabSubmit" style="width:100%;">Request to Collaborate</button>`;

  function sponsorForm(){
    return `<div style="margin-top:12px;">

      <input type="number" id="sponsorAmount" placeholder="Amount (₹, if financial)" style="margin-bottom:8px;">
      <button class="btn btn-teal btn-sm" id="sponsorSubmit" style="width:100%;">I Want to Support This Project</button>
    </div>`;

  // ============ DASHBOARD VIEW ============
  function renderDashboard(){
    if (!db.currentUser){
      return `<div class="empty panel"><h3>No account selected</h3><p>Sign in from the account menu, top right, to see your dashboard.</p></div>`;
    }
    const mine = db.ideas.filter(i=>i.creator===db.currentUser);
    const wishIds = db.wishlist[db.currentUser]||[];
    const wished = db.ideas.filter(i=>wishIds.includes(i.id));
    const pendingReqCount = idea => idea.collabRequests.filter(r=>r.status==='pending').length;
    const totalViews = mine.reduce((s,i)=>s+i.views,0);
    const totalVotes = mine.reduce((s,i)=>s+i.votes.length,0);
    const totalRaised = mine.reduce((s,i)=>s+fundingRaised(i),0);

    return `
      <div>
        <div class="section-title">My Dashboard</div>
        <div class="section-sub">Signed in as ${esc(db.currentUser)}</div>
        <div class="dash-stats">
          <div class="dstat"><div class="l">Ideas Posted</div><div class="v">${mine.length}</div></div>
          <div class="dstat"><div class="l">Total Views</div><div class="v">${totalViews}</div></div>
          <div class="dstat"><div class="l">Total Votes</div><div class="v">${totalVotes}</div></div>
          <div class="dstat"><div class="l">Funding Raised</div><div class="v">₹${totalRaised.toLocaleString('en-IN')}</div></div>

          <div class="section-title" style="font-size:16px;">My Ideas</div>

                <span>Score ${computeScore(i).total}</span>
                <span>${i.views} views</span>
                <span>${i.votes.length} votes</span>
                ${i.fundingRequired>0?`<span>₹${fundingRaised(i).toLocaleString('en-IN')}/₹${i.fundingRequired.toLocaleString('en-IN')}</span>`:''}
              </span>
            </div>`).join('') : `<p style="font-size:13px;color:var(--text-faint);">You haven't posted any ideas yet.</p>`}
        </div>

        <div class="panel">
          <div class="section-title" style="font-size:16px;">My Wishlist</div>
          ${wished.length ? `<div class="cards-grid">${wished.map(ideaCard).join('')}</div>` : `<p style="font-size:13px;color:var(--text-faint);">Nothing saved yet — tap the heart on any idea to save it here.</p>`}
        </div>
      </div>
    `;

  // ============ MASTER RENDER ============
  function render(){
    renderNav();
    renderAcct();
    const app = document.getElementById('app');
    if (ui.view==='market') app.innerHTML = renderMarket();
    else if (ui.view==='post') app.innerHTML = renderPost();
    else if (ui.view==='detail') app.innerHTML = renderDetail();
    else if (ui.view==='dashboard') app.innerHTML = renderDashboard();
    bindViewEvents();
  }

  // ============ EVENT BINDING (per render) ============
  function bindViewEvents(){
    if (ui.view==='market'){
      const s = document.getElementById('searchInput');
      if (s) s.oninput = ()=>{ ui.filters.search = s.value; render(); s.focus(); s.setSelectionRange(s.value.length,s.value.length); };
      const c = document.getElementById('categoryFilter');
      if (c) c.onchange = ()=>{ ui.filters.category = c.value; render(); };
      const sp = document.getElementById('sponsorOnly');
      if (sp) sp.onchange = ()=>{ ui.filters.sponsorOnly = sp.checked; render(); };
      document.querySelectorAll('.sort-tab').forEach(b=> b.onclick = ()=>{ ui.filters.sort = b.dataset.sort; render(); });
      document.querySelectorAll('.idea-card').forEach(card=>{
        card.onclick = (e)=>{
          if (e.target.closest('.heart')) return;
          const idea = db.ideas.find(i=>i.id===card.dataset.id);
          idea.views++; saveDB();
          ui.view='detail'; ui.detailId=card.dataset.id; render();
        };
      });
      document.querySelectorAll('[data-wish]').forEach(btn=>{
        btn.onclick = (e)=>{
          e.stopPropagation();
          if (!requireLogin()) return;
          const id = btn.dataset.wish;
          const list = db.wishlist[db.currentUser] || (db.wishlist[db.currentUser]=[]);
          const idx = list.indexOf(id);
          if (idx>-1) list.splice(idx,1); else list.push(id);
          saveDB(); render();
        };
      });
      const goPost = document.getElementById('goPostBtn');
      if (goPost) goPost.onclick = ()=>{ ui.view='post'; render(); };
    }

    if (ui.view==='post'){
      document.querySelectorAll('.offerCheck').forEach(cb=>{
        cb.onchange = ()=>{
          const anySponsor = document.querySelector('.offerCheck[value="Sponsorship"]').checked;
          document.getElementById('fundingField').style.display = anySponsor ? 'block' : 'none';
        };
      });
      document.getElementById('postForm').onsubmit = (e)=>{
        e.preventDefault();
        if (!requireLogin()) return;
        const offerTypes = Array.from(document.querySelectorAll('.offerCheck:checked')).map(c=>c.value);
        const idea = {
          id: uid(),
          creator: db.currentUser,
          name: document.getElementById('f_name').value.trim(),
          category: document.getElementById('f_category').value,
          price: parseFloat(document.getElementById('f_price').value)||0,
          problem: document.getElementById('f_problem').value.trim(),
          solution: document.getElementById('f_solution').value.trim(),
          description: document.getElementById('f_description').value.trim(),
          resourcesNeeded: document.getElementById('f_resources').value.trim(),
          offerTypes,
          fundingRequired: offerTypes.includes('Sponsorship') ? (parseFloat(document.getElementById('f_funding').value)||0) : 0,
          views:0, votes:[], ratings:[], collabRequests:[], team:[], sponsors:[],
          purchasedBy:null, licensedBy:null,
          createdAt: Date.now()
        };
        if (!idea.name || !idea.problem || !idea.solution || !idea.description){ toast('Please fill in all required fields.'); return; }
        db.ideas.push(idea); saveDB();
        toast('Idea published to the marketplace.');
        ui.view='market'; ui.filters.sort='new'; render();
      };
    }

    if (ui.view==='detail'){
      document.getElementById('backBtn').onclick = ()=>{ ui.view='market'; render(); };
      const idea = db.ideas.find(i=>i.id===ui.detailId);

      const wishBtn = document.getElementById('wishBtn');
      if (wishBtn) wishBtn.onclick = ()=>{
        if(!requireLogin()) return;
        const list = db.wishlist[db.currentUser] || (db.wishlist[db.currentUser]=[]);
        const idx = list.indexOf(idea.id);
        if (idx>-1) list.splice(idx,1); else list.push(idea.id);
        saveDB(); render();
      };
      const voteBtn = document.getElementById('voteBtn');
      if (voteBtn) voteBtn.onclick = ()=>{
        if(!requireLogin()) return;
        const idx = idea.votes.indexOf(db.currentUser);
        if (idx>-1) idea.votes.splice(idx,1); else idea.votes.push(db.currentUser);
        saveDB(); render();
      };
      const buyBtn = document.getElementById('buyBtn');
      if (buyBtn) buyBtn.onclick = ()=>{ idea.purchasedBy = db.currentUser; saveDB(); toast('Purchase recorded.'); render(); };
      const licBtn = document.getElementById('licenseBtn');
      if (licBtn) licBtn.onclick = ()=>{ idea.licensedBy = db.currentUser; saveDB(); toast('License request recorded.'); render(); };

      const collabSubmit = document.getElementById('collabSubmit');
      if (collabSubmit) collabSubmit.onclick = ()=>{
        const role = document.getElementById('collabRole').value;
        const msg = document.getElementById('collabMsg').value.trim();
        idea.collabRequests.push({ id:uid(), user:db.currentUser, role, message:msg, status:'pending' });
        saveDB(); toast('Collaboration request sent.'); render();
      };
      document.querySelectorAll('[data-accept]').forEach(b=> b.onclick = ()=>{
        const r = idea.collabRequests.find(x=>x.id===b.dataset.accept);
        r.status='accepted'; idea.team.push({user:r.user, role:r.role}); saveDB(); toast(r.user+' added to the team.'); render();
      });
      document.querySelectorAll('[data-decline]').forEach(b=> b.onclick = ()=>{
        const r = idea.collabRequests.find(x=>x.id===b.dataset.decline);
        r.status='declined'; saveDB(); render();
      });

      const sponsorSubmit = document.getElementById('sponsorSubmit');
      if (sponsorSubmit) sponsorSubmit.onclick = ()=>{
        const type = document.getElementById('sponsorType').value;
        const amount = type==='Financial funding' ? (parseFloat(document.getElementById('sponsorAmount').value)||0) : 0;
        if (type==='Financial funding' && amount<=0){ toast('Enter an amount to sponsor.'); return; }
        idea.sponsors.push({ user:db.currentUser, type, amount });
        saveDB(); toast('Thank you — sponsorship recorded.'); render();
      };

      let selectedStars = 0;
      const starInput = document.getElementById('starInput');
      if (starInput) starInput.querySelectorAll('svg').forEach((svg,i)=>{
        svg.onclick = ()=>{
          selectedStars = i+1;
          starInput.innerHTML = starsSvg(5, selectedStars);
          starInput.querySelectorAll('svg').forEach((s2,j)=> s2.onclick = svg.onclick );
        };
      });
      const submitReview = document.getElementById('submitReview');
      if (submitReview) submitReview.onclick = ()=>{
        if (!selectedStars){ toast('Select a star rating first.'); return; }
        const comment = document.getElementById('reviewComment').value.trim();
        idea.ratings.push({ user:db.currentUser, stars:selectedStars, comment: comment||'(no comment)' });
        saveDB(); toast('Review submitted.'); render();
      };
    }

    if (ui.view==='dashboard'){
      document.querySelectorAll('.dash-idea-row').forEach(row=>{
        row.onclick = ()=>{ ui.view='detail'; ui.detailId=row.dataset.id; render(); };
      });
      document.querySelectorAll('.idea-card').forEach(card=>{
        card.onclick = (e)=>{
          if (e.target.closest('.heart')) return;
          ui.view='detail'; ui.detailId=card.dataset.id; render();
        };
      });
      document.querySelectorAll('[data-wish]').forEach(btn=>{
        btn.onclick = (e)=>{
          e.stopPropagation();
          const list = db.wishlist[db.currentUser] || (db.wishlist[db.currentUser]=[]);
          const idx = list.indexOf(btn.dataset.wish);
          if (idx>-1) list.splice(idx,1); else list.push(btn.dataset.wish);
          saveDB(); render();
        };
      });
    }
  }

  render();
})();
</script>
</body>
</html>
